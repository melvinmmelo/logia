<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og-card-source</title>
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../../fonts/bricolage-grotesque-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Inter';
    src: url('../../fonts/inter-400.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Inter';
    src: url('../../fonts/inter-500.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
  }

  :root {
    --ink: #17162B;
    --ground: #F6F7FB;
    --indigo: #3A2FB5;
    --muted: #5B6072;
    --hairline: #E2E4EF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: var(--ground);
    background-image: radial-gradient(circle, var(--hairline) 1.4px, transparent 1.6px);
    background-size: 32px 32px;
    font-family: 'Inter', sans-serif;
  }

  .lattice-svg {
    position: absolute;
    inset: 0;
    width: 1200px;
    height: 630px;
    pointer-events: none;
  }
  .lattice-line {
    stroke: var(--hairline);
    stroke-width: 1.5;
    fill: none;
  }
  .lattice-node {
    fill: var(--indigo);
  }
  .lattice-node-plain {
    fill: none;
    stroke: var(--hairline);
    stroke-width: 1.5;
  }

  .card-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 120px;
  }

  .logo-mark {
    width: 96px;
    height: 96px;
    margin-bottom: 28px;
  }

  .brand-name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 20px;
  }

  .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.4;
    color: var(--muted);
    max-width: 820px;
  }

  .accent-bar {
    width: 64px;
    height: 4px;
    border-radius: 9999px;
    background: var(--indigo);
    margin-bottom: 28px;
  }
</style>
</head>
<body>
  <svg class="lattice-svg" viewBox="0 0 1200 630" aria-hidden="true">
    <path class="lattice-line" d="M60 90 L160 150"/>
    <path class="lattice-line" d="M160 150 L100 260"/>
    <path class="lattice-line" d="M160 150 L230 100"/>
    <path class="lattice-line" d="M230 100 L280 220"/>
    <path class="lattice-line" d="M100 260 L200 310"/>
    <circle class="lattice-node" cx="160" cy="150" r="6"/>
    <circle class="lattice-node" cx="230" cy="100" r="6"/>
    <circle class="lattice-node-plain" cx="60" cy="90" r="4"/>
    <circle class="lattice-node-plain" cx="100" cy="260" r="4"/>
    <circle class="lattice-node-plain" cx="280" cy="220" r="4"/>
    <circle class="lattice-node-plain" cx="200" cy="310" r="4"/>

    <path class="lattice-line" d="M1140 500 L1040 440"/>
    <path class="lattice-line" d="M1040 440 L1100 340"/>
    <path class="lattice-line" d="M1040 440 L970 480"/>
    <path class="lattice-line" d="M970 480 L920 380"/>
    <path class="lattice-line" d="M1100 340 L1000 300"/>
    <circle class="lattice-node" cx="1040" cy="440" r="6"/>
    <circle class="lattice-node" cx="970" cy="480" r="6"/>
    <circle class="lattice-node-plain" cx="1140" cy="500" r="4"/>
    <circle class="lattice-node-plain" cx="1100" cy="340" r="4"/>
    <circle class="lattice-node-plain" cx="920" cy="380" r="4"/>
    <circle class="lattice-node-plain" cx="1000" cy="300" r="4"/>
  </svg>

  <div class="card-content">
    <img class="logo-mark" src="../../logo-indigo.png" alt="">
    <div class="accent-bar" aria-hidden="true"></div>
    <h1 class="brand-name">Logia Innovations</h1>
    <p class="tagline">Custom Software &amp; AI Development for SMBs</p>
  </div>
</body>
</html>
